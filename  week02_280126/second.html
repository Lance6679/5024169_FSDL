
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forms & Inputs</title>
  <link rel="stylesheet" href="style2.css">

</head>
<body>

  <form action="#" method="post">
    <fieldset>
      <legend>User Form</legend>

      <label>
        Name:
        <input type="text" name="name" required>
      </label><br><br>

      <label>
        Email:
        <input type="email" name="email">
      </label><br><br>

      <label>
        Password:
        <input type="password">
      </label><br><br>

      <label>
        Age:
        <input type="number" min="1" max="100">
      </label><br><br>

      <label>
        Gender:
        <select>
          <option>Male</option>
          <option>Female</option>
        </select>
      </label><br><br>

      <label>
        Message:
        <textarea rows="4" cols="30"></textarea>
      </label><br><br>

      <input type="checkbox"> Accept Terms<br>
      <input type="radio" name="r"> Option A
      <input type="radio" name="r"> Option B<br><br>

      <input type="submit">
      <input type="reset">

    </fieldset>
  </form>

</body>
</html>
