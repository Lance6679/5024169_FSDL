<!DOCTYPE html>
<html>
<head>
<title>Tic Tac Toe Ultimate</title>
<style>
body{
    font-family:Arial;
    background:#111;
    color:white;
    text-align:center;
}

h1{margin-top:20px;}

.controls{
    margin:15px;
}

.scoreboard{
    margin:15px;
    font-size:20px;
}

.board-container{
    position:relative;
    width:330px;
    margin:30px auto;
}

.board{
    display:grid;
    grid-template-columns:repeat(3,100px);
    grid-template-rows:repeat(3,100px);
    gap:5px;
}

.cell{
    background:#ffffff15;
    border:2px solid #ffffff40;
    font-size:40px;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:0.2s;
}

.cell:hover{transform:scale(1.05);}

.winner-cell{
    color:#00ffcc;
    text-shadow:0 0 15px #00ffcc;
}

.winning-line{
    position:absolute;
    height:6px;
    background:#00ffcc;
    top:0;
    left:0;
    transform-origin:left center;
    width:0;
    transition:width 0.4s ease;
}

button{
    padding:8px 14px;
    margin:5px;
    cursor:pointer;
}

#status{
    margin-top:15px;
    font-size:18px;
}
</style>
</head>
<body>

<h1>Tic Tac Toe</h1>

<div class="controls">
    <button onclick="setMode('ai')">Play vs AI</button>
    <button onclick="setMode('two')">2 Player Mode</button>
</div>

<div class="controls">
    <button onclick="startGame('X')">Choose X</button>
    <button onclick="startGame('O')">Choose O</button>
</div>

<div class="scoreboard">
Player X: <span id="xScore">0</span> |
Player O: <span id="oScore">0</span>
</div>

<div class="board-container">
    <div class="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>
    <div class="winning-line" id="winningLine"></div>
</div>

<div id="status">Select Mode & Symbol</div>
<button onclick="resetRound()">Next Round</button>

<script>
let board=["","","","","","","","",""];
let active=false;

let mode=""; // 'ai' or 'two'
let playerSymbol="";
let aiSymbol="";
let currentPlayer="X";
let startingPlayer="X";

let xScore=0;
let oScore=0;

const cells=document.querySelectorAll(".cell");
const statusDisplay=document.getElementById("status");
const winningLine=document.getElementById("winningLine");
const xScoreDisplay=document.getElementById("xScore");
const oScoreDisplay=document.getElementById("oScore");

const winConditions=[
[0,1,2],[3,4,5],[6,7,8],
[0,3,6],[1,4,7],[2,5,8],
[0,4,8],[2,4,6]
];

cells.forEach(cell=>{
    cell.addEventListener("click",handleClick);
});

function setMode(selectedMode){
    mode=selectedMode;
    statusDisplay.textContent="Mode: "+(mode==="ai"?"AI":"2 Players")+" | Choose X or O";
}

function startGame(symbol){
    if(!mode){
        alert("Select Game Mode First!");
        return;
    }

    playerSymbol=symbol;
    aiSymbol=symbol==="X"?"O":"X";

    startingPlayer="X";
    currentPlayer=startingPlayer;
    active=true;

    resetBoard();

    statusDisplay.textContent=currentPlayer+"'s Turn";

    if(mode==="ai" && currentPlayer===aiSymbol){
        setTimeout(aiMove,400);
    }
}

function handleClick(e){
    const i=e.target.dataset.index;

    if(!active || board[i]!=="" ) return;

    if(mode==="ai"){
        if(currentPlayer!==playerSymbol) return;
        makeMove(i,playerSymbol);

        if(active){
            setTimeout(aiMove,400);
        }
    }else{
        makeMove(i,currentPlayer);
    }
}

function makeMove(i,symbol){
    board[i]=symbol;
    cells[i].textContent=symbol;
    checkWinner();
}

function checkWinner(){
    for(let i=0;i<winConditions.length;i++){
        const [a,b,c]=winConditions[i];

        if(board[a] && board[a]===board[b] && board[a]===board[c]){
            active=false;
            highlightWinner(a,b,c);
            drawLine(i);

            if(board[a]==="X"){
                xScore++;
                xScoreDisplay.textContent=xScore;
            }else{
                oScore++;
                oScoreDisplay.textContent=oScore;
            }

            statusDisplay.textContent=board[a]+" Wins!";
            return;
        }
    }

    if(!board.includes("")){
        statusDisplay.textContent="Draw!";
        active=false;
        return;
    }

    currentPlayer=currentPlayer==="X"?"O":"X";
    statusDisplay.textContent=currentPlayer+"'s Turn";
}

function aiMove(){
    if(!active) return;

    for(let condition of winConditions){
        let [a,b,c]=condition;
        let values=[board[a],board[b],board[c]];
        if(values.filter(v=>v===aiSymbol).length===2 && values.includes("")){
            let index=[a,b,c][values.indexOf("")];
            makeMove(index,aiSymbol);
            return;
        }
    }

    for(let condition of winConditions){
        let [a,b,c]=condition;
        let values=[board[a],board[b],board[c]];
        if(values.filter(v=>v===playerSymbol).length===2 && values.includes("")){
            let index=[a,b,c][values.indexOf("")];
            makeMove(index,aiSymbol);
            return;
        }
    }

    let empty=board.map((v,i)=>v===""?i:null).filter(v=>v!==null);
    let move=empty[Math.floor(Math.random()*empty.length)];
    makeMove(move,aiSymbol);
}

function highlightWinner(a,b,c){
    cells[a].classList.add("winner-cell");
    cells[b].classList.add("winner-cell");
    cells[c].classList.add("winner-cell");
}

function drawLine(index){
    const [a,,c]=winConditions[index];

    const rectA=cells[a].getBoundingClientRect();
    const rectC=cells[c].getBoundingClientRect();
    const boardRect=document.querySelector(".board-container").getBoundingClientRect();

    const x1=rectA.left+rectA.width/2-boardRect.left;
    const y1=rectA.top+rectA.height/2-boardRect.top;

    const x2=rectC.left+rectC.width/2-boardRect.left;
    const y2=rectC.top+rectC.height/2-boardRect.top;

    const length=Math.sqrt((x2-x1)**2+(y2-y1)**2);
    const angle=Math.atan2(y2-y1,x2-x1)*180/Math.PI;

    winningLine.style.width=length+"px";
    winningLine.style.top=y1+"px";
    winningLine.style.left=x1+"px";
    winningLine.style.transform=`rotate(${angle}deg)`;
}

function resetBoard(){
    board=["","","","","","","","",""];
    winningLine.style.width="0";

    cells.forEach(cell=>{
        cell.textContent="";
        cell.classList.remove("winner-cell");
    });
}

function resetRound(){
    if(!mode) return;

    resetBoard();
    active=true;

    startingPlayer=startingPlayer==="X"?"O":"X";
    currentPlayer=startingPlayer;

    statusDisplay.textContent=currentPlayer+"'s Turn";

    if(mode==="ai" && currentPlayer===aiSymbol){
        setTimeout(aiMove,400);
    }
}
</script>

</body>
</html>
