<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Semantic & Media</title>
</head>
<body>

<header>
  <h1>Website Header</h1>
  <nav>
    <a href="#">Home</a> |
    <a href="#">About</a>
  </nav>
</header>

<main>
  <article>
    <header>
      <h2>Article Title</h2>
      <time datetime="2026-01-01">Jan 1, 2026</time>
    </header>

    <section>
      <p>Article content goes here.</p>
    </section>

    <figure>
      <img src="https://via.placeholder.com/150" alt="Placeholder">
      <figcaption>Image Caption</figcaption>
    </figure>
  </article>

  <aside>
    <p>Sidebar content</p>
  </aside>

  <video controls width="300">
    <source src="video.mp4" type="video/mp4">
  </video>

  <audio controls>
    <source src="audio.mp3" type="audio/mpeg">
  </audio>
</main>

<footer>
  <address>
    Contact: <a href="mailto:test@example.com">Email</a>
  </address>
</footer>

</body>
</html>
